<img [src]="voyage().photo" width="70px" height="70px">
<span>
   <span class="badge text-bg-success">
  {{voyage().destination}}
   </span> 
    prix: {{voyage().price}} Dt
     Duree: {{voyage().nbDays|peroid}}

    }
    @else {
        **voyage complet**
    }
